name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm test
      - run: npm run test:package
      - name: Verify uninstall in a disposable container
        run: docker run --rm -i -v "$PWD/deploy:/checks:ro" ubuntu@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401 bash < test/lifecycle.sh
      - name: Verify failed upgrade recovery in a disposable container
        run: docker run --rm -i -v "$PWD/deploy:/checks:ro" ubuntu@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401 bash < test/install-rollback.sh
      - run: npm run test:desk && npm run test:e2e
      - run: npm run site:build && npm run test:site
